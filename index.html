<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이어봄 B역할 테스트</title>
</head>
<body style="padding: 50px; text-align: center; font-family: sans-serif;">
    
    <!-- 어르신 테스트 화면 (오늘 완료) -->
    <h1>👴 어르신 마이크 테스트</h1>
    <button id="recordBtn" style="padding: 20px; font-size: 20px; cursor: pointer;">
        🎤 마이크 켜기
    </button>
    <h2 id="resultText" style="margin-top: 30px; color: #333;">이곳에 하신 말씀이 글로 나타납니다.</h2>

    <hr style="margin: 50px 0;">

    <!-- 임산부 테스트 화면 (다음 목표) -->
    <h1>🤰 임산부 고민 입력 테스트</h1>
    <textarea id="worryInput" rows="4" cols="50" placeholder="여기에 고민을 적어보세요..." style="padding: 10px; font-size: 16px;"></textarea>
    <br><br>
    <button id="submitWorryBtn" style="padding: 15px; font-size: 18px; cursor: pointer;">
        🚀 고민 전송하기 (AI 분석 시작)
    </button>
    <h3 id="loadingText" style="color: blue; display: none;">AI가 경험 태그를 분석 중입니다... ⏳</h3>
    <p id="aiResultText"></p> <!-- 분석 결과가 뜰 자리 -->

    <script type="module" src="ui.js"></script>
</body>
</html>
